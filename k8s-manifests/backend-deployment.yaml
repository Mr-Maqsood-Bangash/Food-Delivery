# backend-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: maqsoodbangash/food-backend:v2
        ports:
        - containerPort: 4000        # ← 5000 se 4000
        env:
        - name: PORT
          value: "4000"              # ← 5000 se 4000
        - name: DB_HOST
          value: "database-service"
        - name: DB_PORT
          value: "3306"
        - name: DB_NAME
          value: "fooddb"
        - name: DB_USER
          value: "admin"
        - name: DB_PASSWORD
          value: "admin123"
