namespaces:
  frontend: green-frontend
  backend: green-backend
  database: green-database

storage:
  create: true
  storageClassName: green-standard-storage
  provisioner: kubernetes.io/no-provisioner
  volumeBindingMode: WaitForFirstConsumer
  pv:
    name: green-mongo-pv
    capacity: 1Gi
    hostPath: /data/green-mongo
    accessMode: ReadWriteOnce
  pvc:
    name: mongo-pvc
    size: 1Gi

mongo:
  username: admin
  password: securepass
  replicaSetName: rs0
  database:
    image: mongo:6
    storageRequest: 1Gi
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

backend:
  image:
    repository: maqsoodbangash/food-backend
    tag: v1.0.4
    pullPolicy: IfNotPresent
  replicaCount: 1
  containerPort: 4000
  service:
    port: 4000
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    path: /
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 20
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      initialDelaySeconds: 10
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3

frontend:
  image:
    repository: maqsoodbangash/food-frontend
    tag: v1.0.21
    pullPolicy: IfNotPresent
  replicaCount: 1
  containerPort: 3000
  service:
    type: NodePort
    port: 80
    nodePort: 30008
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    path: /
    liveness:
      initialDelaySeconds: 10
      periodSeconds: 15
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 10

mongoInit:
  enabled: true
  image: mongo:6
  backoffLimit: 5

ingress:
  enabled: false
  className: nginx
  host: ""
  annotations: {}
